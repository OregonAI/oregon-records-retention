note: "Every upstream source this corpus consumes. Human-approved via PR before ingestion.\nEnumerated\
  \ from the index page under `index:` by src/enumerate_schedules.py.\n\nTwo traps recorded here so a\
  \ future re-enumeration does not fall into them:\n1. The index page's raw HTML hash is UNSTABLE — it\
  \ is SharePoint-rendered and carries\n   a fresh __VIEWSTATE and correlation id on every request. Change\
  \ detection must\n   compare the extracted LINK SET, never the page bytes.\n2. Titles come from the\
  \ paragraph label PRECEDING each anchor, not the anchor text:\n   66 of the 76 anchors read literally\
  \ 'Schedule'. Ten ODOT divisions nested in a\n   blockquote are the exception and do carry descriptive\
  \ anchor text.\n\n`id` is the lowercased slug; four upstream filenames are uppercase (schedule-OWEB.pdf,\n\
  OYA, PSRB, TSPC) and the document id must match ^[a-z0-9][a-z0-9-]+$, so id and URL\ndiffer in case\
  \ for those four. Lowercasing introduces no collisions (checked).\n"
