name: publish-index

# Publish corpus-index.json to this corpus's Pages site.
#
# Two consumers: a sibling corpus resolving a citation into this one needs to know which
# schedule ids exist and what they are called, and the org landing page
# (https://oregonai.github.io/) reads the same file for live document counts. Without it
# this corpus renders there with its declared status and no counts.
#
# This corpus declares `siblings: executive-regulatory-frameworks` in _meta/corpus.yml,
# and the relationship runs both ways — the general schedules in OAR ch. 166 live over
# there and are referenced here, never copied. That corpus can only resolve a reference
# back into this one if this index is published.
#
# Index only, no landing page — see the reusable workflow's header for why.
on:
  push:
    branches: [main]
  # The index is derived from the corpus, and the scheduled refresh changes the corpus
  # without touching this workflow. Republish on the same cadence so the published index
  # cannot silently lag what the repo holds.
  schedule:
    - cron: "40 9 * * 1"
  workflow_dispatch:

# The caller must grant these. A reusable workflow can only REDUCE the caller's
# permissions, never escalate — and this org's default workflow token is read-only, so
# without this block the deploy fails at startup with "requesting 'pages: write', but is
# only allowed 'pages: none'" before any job is created.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    uses: OregonAI/corpus-toolkit/.github/workflows/publish-index.yml@v1.4.0
    with:
      # Pin the CODE, not just the workflow file above — separate knobs.
      toolkit-ref: v1.4.0
