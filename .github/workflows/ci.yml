name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontmatter:
    uses: OregonAI/corpus-toolkit/.github/workflows/validate-frontmatter.yml@v1.16.0
    with:
      # Pin the CODE, not just the workflow file above — separate knobs.
      toolkit-ref: v1.16.0
  provenance:
    uses: OregonAI/corpus-toolkit/.github/workflows/verify-provenance.yml@v1.16.0
    with:
      # Pin the CODE, not just the workflow file above — separate knobs.
      toolkit-ref: v1.16.0
  links:
    uses: OregonAI/corpus-toolkit/.github/workflows/check-links.yml@v1.16.0
    with:
      # Pin the CODE, not just the workflow file above — separate knobs.
      toolkit-ref: v1.16.0
      # The template calls this with no exclusions. lychee walks './**/*.md',
      # which includes _meta/templates/document.md — a skeleton whose example
      # URLs are not meant to resolve, so every PR would fail on link rot that
      # is not link rot. Snapshots are excluded pre-emptively: they are .txt
      # today and so out of lychee's glob, but that is a coincidence of format
      # rather than a decision, and a future .md snapshot should not silently
      # start dragging every source URL into the per-PR gate.
      exclude-paths: |
        _meta/snapshots
        _meta/templates

  # Generated artifacts must not drift from the documents they are derived from.
  # This is the gate the toolkit cannot provide: it only READS _meta/graph.json,
  # so nothing upstream notices when a schedule is added and the graph is not
  # rebuilt — resolve_citation and graph_neighbors would simply stop finding the
  # new document, silently and with no error anywhere.
  #
  # Offline and fast on purpose: no network, so it belongs on every PR. Checks
  # that hit the Archives Division live are on the weekly cron instead.
  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Authority graph must be current
        run: python3 src/build_graph.py --check
